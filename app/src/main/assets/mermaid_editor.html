<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Mermaid Editor</title>
    
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Roboto', sans-serif;
            background-color: #1e1e1e;
            overflow: hidden;
        }
        
        .editor-container {
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
        }
        
        .CodeMirror {
            height: 100% !important;
            font-size: 14px;
            line-height: 1.5;
            font-family: 'Fira Code', 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
        }
        
        .CodeMirror-line {
            padding-left: 10px;
        }
        
        .CodeMirror-linenumber {
            padding: 0 8px 0 0;
            min-width: 20px;
            text-align: right;
            color: #6c7680;
        }
        
        /* Mermaid syntax highlighting */
        .cm-mermaid-keyword {
            color: #c792ea;
            font-weight: bold;
        }
        
        .cm-mermaid-node {
            color: #82aaff;
        }
        
        .cm-mermaid-arrow {
            color: #89ddff;
            font-weight: bold;
        }
        
        .cm-mermaid-string {
            color: #c3e88d;
        }
        
        .cm-mermaid-comment {
            color: #546e7a;
            font-style: italic;
        }
        
        .cm-mermaid-bracket {
            color: #ff5370;
            font-weight: bold;
        }
        
        .cm-mermaid-operator {
            color: #89ddff;
        }
        
        .cm-mermaid-number {
            color: #f78c6c;
        }
        
        /* Error highlighting */
        .CodeMirror-lint-error {
            background: rgba(255, 83, 112, 0.2);
            border-left: 3px solid #ff5370;
        }
        
        /* Selection and cursor */
        .CodeMirror-selected {
            background: rgba(130, 170, 255, 0.2) !important;
        }
        
        .CodeMirror-cursor {
            border-left: 2px solid #ffcb6b;
        }
    </style>
</head>
<body>
    <div class="editor-container">
        <textarea id="mermaid-editor"></textarea>
    </div>

    <!-- CodeMirror JavaScript - Security: Using local files instead of CDN -->
    <script>
        // Simplified CodeMirror functionality for security
        // This replaces the external CDN dependencies with minimal local implementation
        
        class SimpleCodeMirror {
            constructor(textarea, options = {}) {
                this.textarea = textarea;
                this.options = options;
                this.wrapper = this.createWrapper();
                this.setupEditor();
            }
            
            createWrapper() {
                const wrapper = document.createElement('div');
                wrapper.className = 'CodeMirror';
                wrapper.style.cssText = `
                    height: 100%;
                    font-size: 14px;
                    line-height: 1.5;
                    font-family: 'Fira Code', 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
                    background-color: #1e1e1e;
                    color: #ffffff;
                    border: none;
                    resize: none;
                    outline: none;
                `;
                
                const editor = document.createElement('textarea');
                editor.className = 'CodeMirror-textarea';
                editor.style.cssText = `
                    width: 100%;
                    height: 100%;
                    background: transparent;
                    color: inherit;
                    font: inherit;
                    border: none;
                    resize: none;
                    outline: none;
                    padding: 10px;
                    box-sizing: border-box;
                `;
                editor.placeholder = this.options.placeholder || '';
                
                wrapper.appendChild(editor);
                this.textarea.parentNode.insertBefore(wrapper, this.textarea);
                this.textarea.style.display = 'none';
                
                return wrapper;
            }
            
            setupEditor() {
                this.editor = this.wrapper.querySelector('.CodeMirror-textarea');
                this.editor.addEventListener('input', () => {
                    this.textarea.value = this.editor.value;
                    if (this.changeCallback) {
                        this.changeCallback(this, { origin: '+input' });
                    }
                });
                
                this.editor.addEventListener('focus', () => {
                    this.wrapper.classList.add('CodeMirror-focused');
                });
                
                this.editor.addEventListener('blur', () => {
                    this.wrapper.classList.remove('CodeMirror-focused');
                });
            }
            
            getValue() {
                return this.editor.value;
            }
            
            setValue(value) {
                this.editor.value = value || '';
                this.textarea.value = value || '';
            }
            
            focus() {
                this.editor.focus();
            }
            
            on(event, callback) {
                if (event === 'change') {
                    this.changeCallback = callback;
                } else if (event === 'cursorActivity') {
                    this.editor.addEventListener('selectionchange', () => {
                        callback(this);
                    });
                }
            }
            
            getCursor() {
                const pos = this.editor.selectionStart;
                const lines = this.editor.value.substring(0, pos).split('\n');
                return {
                    line: lines.length - 1,
                    ch: lines[lines.length - 1].length
                };
            }
            
            setCursor(line, ch) {
                const lines = this.editor.value.split('\n');
                let pos = 0;
                for (let i = 0; i < line && i < lines.length; i++) {
                    pos += lines[i].length + 1; // +1 for newline
                }
                pos += Math.min(ch, lines[line]?.length || 0);
                this.editor.setSelectionRange(pos, pos);
            }
            
            replaceSelection(text) {
                const start = this.editor.selectionStart;
                const end = this.editor.selectionEnd;
                const value = this.editor.value;
                this.editor.value = value.substring(0, start) + text + value.substring(end);
                this.editor.setSelectionRange(start + text.length, start + text.length);
                this.textarea.value = this.editor.value;
            }
            
            refresh() {
                // No-op for compatibility
            }
            
            getWrapperElement() {
                return this.wrapper;
            }
        }
        
        // CodeMirror compatibility layer
        window.CodeMirror = {
            fromTextArea: function(textarea, options) {
                return new SimpleCodeMirror(textarea, options);
            },
            defineMode: function() {
                // No-op for compatibility
            },
            registerHelper: function() {
                // No-op for compatibility
            },
            Pos: function(line, ch) {
                return { line: line, ch: ch };
            }
        };
    </script>

    <script>
        // Define Mermaid syntax highlighting mode
        CodeMirror.defineMode("mermaid", function() {
            return {
                token: function(stream, state) {
                    // Skip whitespace
                    if (stream.eatSpace()) return null;
                    
                    // Comments (lines starting with %%)
                    if (stream.match(/^%%.*$/)) {
                        return "mermaid-comment";
                    }
                    
                    // Diagram type keywords
                    if (stream.match(/^(graph|flowchart|sequenceDiagram|classDiagram|stateDiagram|erDiagram|journey|gantt|pie|gitgraph|mindmap|timeline|sankey|xychart|block|packet|architecture)\b/)) {
                        return "mermaid-keyword";
                    }
                    
                    // Direction keywords for graphs
                    if (stream.match(/^(TD|TB|BT|RL|LR)\b/)) {
                        return "mermaid-keyword";
                    }
                    
                    // Node shapes and brackets
                    if (stream.match(/[\[\](){}><]/)) {
                        return "mermaid-bracket";
                    }
                    
                    // Arrows and connections
                    if (stream.match(/-->|->|-\.-|-.->|==>|==|--|\|\||::/)) {
                        return "mermaid-arrow";
                    }
                    
                    // String literals (quoted text)
                    if (stream.match(/"[^"]*"/)) {
                        return "mermaid-string";
                    }
                    
                    // Node IDs and labels
                    if (stream.match(/[A-Za-z_][A-Za-z0-9_]*/)) {
                        return "mermaid-node";
                    }
                    
                    // Numbers
                    if (stream.match(/\d+/)) {
                        return "mermaid-number";
                    }
                    
                    // Operators and special characters
                    if (stream.match(/[+\-*/%=<>!&|]/)) {
                        return "mermaid-operator";
                    }
                    
                    // Default: consume one character
                    stream.next();
                    return null;
                }
            };
        });

        // Initialize CodeMirror editor
        let editor = CodeMirror.fromTextArea(document.getElementById("mermaid-editor"), {
            mode: "mermaid",
            theme: "material-darker",
            lineNumbers: true,
            lineWrapping: true,
            matchBrackets: true,
            autoCloseBrackets: true,
            styleActiveLine: true,
            foldGutter: true,
            gutters: ["CodeMirror-linenumbers", "CodeMirror-foldgutter"],
            extraKeys: {
                "Ctrl-Space": "autocomplete",
                "Ctrl-Q": function(cm) { cm.foldCode(cm.getCursor()); }
            },
            placeholder: "Enter your Mermaid diagram syntax here...\n\nExample:\ngraph TD\n    A[Start] --> B[Process]\n    B --> C[End]"
        });

        // Auto-complete hints for Mermaid
        CodeMirror.registerHelper("hint", "mermaid", function(editor) {
            const cur = editor.getCursor();
            const token = editor.getTokenAt(cur);
            const start = token.start;
            const end = cur.ch;
            const word = token.string;

            const hints = [
                // Diagram types
                "graph", "flowchart", "sequenceDiagram", "classDiagram", 
                "stateDiagram", "erDiagram", "journey", "gantt", "pie", 
                "gitgraph", "mindmap", "timeline",
                
                // Directions
                "TD", "TB", "BT", "RL", "LR",
                
                // Common patterns
                "A[Label]", "B(Round)", "C{Diamond}", "D((Circle))", 
                "E>Flag]", "F[[Subroutine]]", "G[(Database)]",
                
                // Arrows
                "-->", "->", "-.-", "-.->", "==>", "==", "---", "||"
            ];

            const filtered = hints.filter(h => h.toLowerCase().startsWith(word.toLowerCase()));
            
            return {
                list: filtered,
                from: CodeMirror.Pos(cur.line, start),
                to: CodeMirror.Pos(cur.line, end)
            };
        });

        // JavaScript Bridge for Android communication
        class MermaidEditorBridge {
            constructor() {
                this.editor = editor;
                this.setupEventListeners();
            }

            // Get current editor content
            getContent() {
                return this.editor.getValue();
            }

            // Set editor content
            setContent(content) {
                this.editor.setValue(content || "");
            }

            // Insert text at cursor position
            insertText(text) {
                this.editor.replaceSelection(text);
                this.editor.focus();
            }

            // Clear editor content
            clear() {
                this.editor.setValue("");
            }

            // Set editor theme
            setTheme(theme) {
                this.editor.setOption("theme", theme);
            }

            // Set font size
            setFontSize(size) {
                const wrapper = this.editor.getWrapperElement();
                wrapper.style.fontSize = size + "px";
                this.editor.refresh();
            }

            // Focus editor
            focus() {
                this.editor.focus();
            }

            // Setup event listeners
            setupEventListeners() {
                this.editor.on("change", (instance, changeObj) => {
                    // Notify Android about content changes
                    if (window.Android && window.Android.onContentChanged) {
                        window.Android.onContentChanged(instance.getValue());
                    }
                });

                this.editor.on("cursorActivity", (instance) => {
                    const cursor = instance.getCursor();
                    if (window.Android && window.Android.onCursorPositionChanged) {
                        window.Android.onCursorPositionChanged(cursor.line, cursor.ch);
                    }
                });
            }

            // Insert template
            insertTemplate(templateContent) {
                this.editor.setValue(templateContent);
                this.editor.setCursor(0, 0);
                this.editor.focus();
            }

            // Get cursor position
            getCursorPosition() {
                const cursor = this.editor.getCursor();
                return { line: cursor.line, ch: cursor.ch };
            }

            // Set cursor position
            setCursorPosition(line, ch) {
                this.editor.setCursor(line, ch);
                this.editor.focus();
            }
        }

        // Initialize bridge
        window.mermaidBridge = new MermaidEditorBridge();

        // Expose methods globally for Android WebView
        window.getContent = () => window.mermaidBridge.getContent();
        window.setContent = (content) => window.mermaidBridge.setContent(content);
        window.insertText = (text) => window.mermaidBridge.insertText(text);
        window.clear = () => window.mermaidBridge.clear();
        window.setTheme = (theme) => window.mermaidBridge.setTheme(theme);
        window.setFontSize = (size) => window.mermaidBridge.setFontSize(size);
        window.focus = () => window.mermaidBridge.focus();
        window.insertTemplate = (content) => window.mermaidBridge.insertTemplate(content);

        // Auto-focus when page loads
        window.addEventListener('load', function() {
            setTimeout(() => {
                editor.focus();
            }, 100);
        });
    </script>
</body>
</html>

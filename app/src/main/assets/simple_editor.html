<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Simple Editor</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: monospace;
            background-color: #1e1e1e;
            color: #ffffff;
            height: 100vh;
            overflow: hidden;
        }
        
        .container {
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .status {
            padding: 10px;
            background-color: #2d2d2d;
            border-bottom: 1px solid #3e3e3e;
            font-size: 12px;
            color: #888;
        }
        
        .editor {
            flex: 1;
            padding: 10px;
            background-color: #1e1e1e;
            border: 1px solid #3e3e3e;
            outline: none;
            color: #ffffff;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.5;
            resize: none;
            white-space: pre;
            overflow-wrap: normal;
            -webkit-user-select: text;
            -webkit-touch-callout: default;
            -webkit-tap-highlight-color: rgba(255, 255, 255, 0.1);
        }
        
        .editor:focus {
            background-color: #252526;
            border-color: #007acc;
        }
        
        .editor:active {
            background-color: #252526;
        }
        
        /* Basic syntax highlighting simulation */
        .keyword { color: #c792ea; }
        .node { color: #82aaff; }
        .arrow { color: #89ddff; }
        .string { color: #c3e88d; }
    </style>
</head>
<body>
    <div class="container">
        <div class="status" id="status">
            Simple Editor Ready - Type to test
        </div>
        <textarea 
            class="editor" 
            id="editor" 
            placeholder="Type your Mermaid diagram here...

Example:
graph TD
    A[Start] --> B[Process]
    B --> C[End]"
            spellcheck="false"
        ></textarea>
    </div>

    <script>
        console.log('Simple editor script loaded');
        
        const editor = document.getElementById('editor');
        const status = document.getElementById('status');
        
        let isReady = false;
        
        // Initialize
        function initEditor() {
            console.log('Initializing editor');
            isReady = true;
            status.textContent = 'Editor Ready ✓';
            
            if (window.Android && window.Android.onWebViewReady) {
                console.log('Calling Android onWebViewReady');
                window.Android.onWebViewReady();
            }
        }
        
        // Content management
        function getContent() {
            console.log('Getting content:', editor.value);
            return editor.value;
        }
        
        function setContent(content) {
            console.log('Setting content:', content);
            editor.value = content || '';
            updateStatus();
        }
        
        function insertText(text) {
            console.log('Inserting text:', text);
            const cursorPos = editor.selectionStart;
            const textBefore = editor.value.substring(0, cursorPos);
            const textAfter = editor.value.substring(editor.selectionEnd);
            editor.value = textBefore + text + textAfter;
            editor.selectionStart = editor.selectionEnd = cursorPos + text.length;
            editor.focus();
            updateStatus();
        }
        
        function clear() {
            console.log('Clearing editor');
            editor.value = '';
            editor.focus();
            updateStatus();
        }
        
        function focus() {
            console.log('Focusing editor');
            editor.focus();
        }
        
        function updateStatus() {
            const length = editor.value.length;
            status.textContent = `Ready ✓ | ${length} characters`;
            
            if (window.Android && window.Android.onContentChanged) {
                window.Android.onContentChanged(editor.value);
            }
        }
        
        // Event listeners
        editor.addEventListener('input', function(e) {
            console.log('Content changed');
            updateStatus();
        });
        
        editor.addEventListener('focus', function(e) {
            console.log('Editor focused');
            status.textContent = 'Editing... | ' + editor.value.length + ' characters';
        });
        
        editor.addEventListener('blur', function(e) {
            console.log('Editor blurred');
            updateStatus();
        });
        
        // Expose functions globally
        window.getContent = getContent;
        window.setContent = setContent;
        window.insertText = insertText;
        window.clear = clear;
        window.focus = focus;
        window.insertTemplate = setContent; // Same as setContent for now
        
        // Initialize when page loads
        document.addEventListener('DOMContentLoaded', function() {
            console.log('DOM loaded, initializing...');
            setTimeout(initEditor, 100);
        });
        
        // Fallback initialization
        window.addEventListener('load', function() {
            console.log('Window loaded');
            if (!isReady) {
                setTimeout(initEditor, 200);
            }
        });
        
        console.log('Script setup complete');
    </script>
</body>
</html>

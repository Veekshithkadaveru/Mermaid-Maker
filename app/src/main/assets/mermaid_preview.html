<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, minimum-scale=0.5, maximum-scale=5.0">
    <title>Mermaid Preview</title>
    
    <style>
        body {
            margin: 0;
            padding: 16px;
            font-family: 'Roboto', sans-serif;
            background-color: transparent;
            overflow-x: auto;
            overflow-y: auto;
        }
        
        .container {
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .status {
            padding: 8px 12px;
            background-color: #e8f5e8;
            border: 1px solid #4caf50;
            border-radius: 4px;
            font-size: 12px;
            color: #2e7d32;
            margin-bottom: 16px;
            display: none;
        }
        
        .error {
            padding: 10px 12px;
            background-color: #ffebee;
            border: 1px solid #ef5350;
            border-radius: 8px;
            font-size: 13px;
            color: #b71c1c;
            margin-bottom: 16px;
            display: none;
        }
        .error .title { font-weight: 600; margin-bottom: 4px; display: flex; align-items: center; gap: 6px; }
        .error .details { opacity: 0.9; }
        .error-panel { display:flex; gap:12px; background:#fff; border: 1px solid #ead5d5; border-radius:16px; padding:18px; box-shadow:0 6px 20px rgba(0,0,0,0.05); max-width:960px; margin:12px auto 0 auto; }
        .error-panel .error-accent { width:6px; border-radius:8px; background: linear-gradient(180deg,#ef5350 0%, #ff7043 100%); }
        .error-panel .panel-body { flex:1; min-width:0; }
        .error-panel .panel-header { display:flex; align-items:center; gap:10px; margin:0 0 8px 0; }
        .error-panel .panel-header .emoji { font-size:20px; line-height:1; }
        .error-panel h1 { margin:0; color:#c62828; font-size:24px; font-weight:800; letter-spacing:0.2px; }
        .error-panel .badge { background:#fdecee; color:#b71c1c; border:1px solid #f5b1b8; border-radius:999px; padding:4px 8px; font-size:12px; font-weight:700; }
        .error-panel pre { white-space:pre-wrap; background:#fff7f7; border:1px dashed #f5b1b8; padding:12px; border-radius:8px; overflow:auto; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
        .error-panel .suggestions { margin-top:16px; }
        .error-panel .suggestions h2 { margin:0 0 8px 0; color:#ad2c2c; font-size:18px; font-weight:800; letter-spacing:0.2px; }
        .error-panel ul { margin:0; padding-left:20px; }
        .error-panel li { margin:6px 0; line-height:1.4; }
        .error-panel code { background:#fdecee; border-radius:6px; padding:0 6px; }
        .error-panel .ai { margin-top:12px; }
        .error-panel .ai button { background-image: linear-gradient(135deg,#ef5350,#ff7043); color:#fff; border:none; padding:10px 14px; border-radius:999px; font-weight:700; letter-spacing:0.2px; box-shadow:0 4px 10px rgba(239,83,80,0.25); }
        .error-panel .muted { margin-top:10px; color:#8a6e6e; font-size:12px; }
        
        .loading {
            padding: 8px 12px;
            background-color: #e3f2fd;
            border: 1px solid #2196f3;
            border-radius: 4px;
            font-size: 12px;
            color: #1565c0;
            margin-bottom: 16px;
            display: none;
        }
        
        .preview-container {
            flex: 0 0 auto;
            width: 100%;
            min-height: 200px;
            background-color: transparent;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 16px;
            box-sizing: border-box;
            overflow: auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        /* Orientation modifiers (styling intentionally minimal; rendering adjusts via direction) */
        .preview-container.vertical {}
        .preview-container.horizontal {}
        
        #preview {
            width: 100%;
            min-height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        
        #preview svg {
            width: 100% !important;
            height: auto !important;
            background: transparent !important;
            display: block;
        }

        /* Scaled content wrapper */
        #preview-scale {
            transform-origin: top left;
            will-change: transform;
            background: transparent;
        }
        
        .placeholder {
            color: #9e9e9e;
            font-style: italic;
            font-size: 14px;
        }
        
        /* Dark mode support */
        @media (prefers-color-scheme: dark) {
            body {
                background-color: transparent;
                color: #ffffff;
            }
            
            .preview-container {
                background-color: transparent;
                border-color: #333333;
            }
            
            .placeholder {
                color: #666666;
            }
        }
        /* Do not hide legitimate diagram content; only style preview container */
    </style>
</head>
<body>
    <div class="container">
        <div id="status" class="status">Preview ready</div>
        <div id="error" class="error"></div>
        <div id="loading" class="loading">Rendering diagram...</div>
        
        <div class="preview-container vertical" id="preview-container">
            <div id="preview">
                <div class="placeholder">Diagram preview will appear here</div>
            </div>
        </div>
    </div>

    <!-- Load Mermaid.js -->
    <script src="mermaid.min.js"></script>
    
    <script>
        console.log('Mermaid Preview HTML loaded');
        
        // Initialize Mermaid
        mermaid.initialize({
            startOnLoad: false,
            theme: 'default',
            themeVariables: {
                primaryColor: '#2196f3',
                primaryTextColor: '#ffffff',
                primaryBorderColor: '#1976d2',
                lineColor: '#666666',
                sectionBkgColor: '#f5f5f5',
                altSectionBkgColor: '#ffffff',
                gridColor: '#e0e0e0',
                secondaryColor: '#ff9800',
                tertiaryColor: '#4caf50'
            },
            securityLevel: 'strict',
            flowchart: {
                useMaxWidth: true,
                htmlLabels: false
            },
            sequence: {
                useMaxWidth: true,
                diagramMarginX: 50,
                diagramMarginY: 10,
                actorMargin: 50,
                width: 150,
                height: 65,
                boxMargin: 10,
                boxTextMargin: 5,
                noteMargin: 10,
                messageMargin: 35
            }
        });
        
        console.log('Mermaid initialized with version:', mermaid.version);
        
        // State management
        let isRendering = false;
        let lastRenderedContent = '';
        let renderTimeout = null;
        let lastContentHash = '';
        let renderWatchdog = null;
        let lastSource = '';
        
        // DOM elements
        const statusElement = document.getElementById('status');
        const errorElement = document.getElementById('error');
        const loadingElement = document.getElementById('loading');
        const previewElement = document.getElementById('preview');
        const previewContainer = document.getElementById('preview-container');
        let orientation = 'vertical'; // default
        
        // Utility functions
        function showStatus(message) {
            statusElement.textContent = message;
            statusElement.style.display = 'block';
            errorElement.style.display = 'none';
            loadingElement.style.display = 'none';
            // Remove any rich error panel on success/status
            removeErrorPanel();
            setPreviewVisible(true);
        }
        
        function showError(message, sourceText) {
            // Hide the small top error chip; we use only the rich panel
            errorElement.innerHTML = '';
            errorElement.style.display = 'none';
            statusElement.style.display = 'none';
            loadingElement.style.display = 'none';
            
            // Expose last error source globally for inline handlers
            try { window.__lastErrorSource = (sourceText || lastSource || ''); } catch (e) { window.__lastErrorSource = ''; }

            // Rich error panel below preview
            const panel = document.createElement('div');
            panel.className = 'error-panel';
            panel.innerHTML = `
                <div class="error-accent"></div>
                <div class="panel-body">
                    <div class="panel-header">
                        <div class="emoji">⚠️</div>
                        <h1>Syntax Error</h1>
                        <span class="badge">Mermaid</span>
                    </div>
                    <pre>${(sourceText || lastSource || '').replace(/</g,'&lt;').replace(/>/g,'&gt;')}</pre>
                    <div class="suggestions">
                        <h2>Suggestions</h2>
                        <ul>
                            <li>Start with a diagram type (e.g., <code>graph TD</code>, <code>sequenceDiagram</code>).</li>
                            <li>Keep one statement per line and close all brackets.</li>
                            <li>Ensure identifiers match and arrows use valid syntax.</li>
                        </ul>
                        <div class="ai"><button id="ai-fix-btn" type="button" onclick="try{if(window.Android&&window.Android.onFixWithAi){window.Android.onFixWithAi(window.__lastErrorSource||'');}}catch(e){}">Fix with AI</button></div>
                        <div class="muted">Tip: You can paste plain text and let AI shape it.</div>
                    </div>
                </div>`;
            // Insert after preview container
            const container = document.querySelector('.preview-container');
            if (container && panel) {
                // Remove existing sibling panels to avoid duplicates
                const existing = container.parentNode.querySelectorAll('.error-panel');
                existing.forEach(el => el.remove());
                container.parentNode.insertBefore(panel, container.nextSibling);
            }
            // Wire AI fix button if available
            // Note: inline onclick handler is set on the button to avoid duplicate bindings

            // Hide preview container while error panel is shown
            setPreviewVisible(false);
            // No AI button; nothing to wire here

            // Notify Android about the error
            if (window.Android && window.Android.onRenderError) {
                window.Android.onRenderError(message);
            }
        }
        
        function showLoading(message = 'Rendering diagram...') {
            loadingElement.textContent = message;
            loadingElement.style.display = 'block';
            statusElement.style.display = 'none';
            errorElement.style.display = 'none';
        }
        
        function hideAllMessages() {
            statusElement.style.display = 'none';
            errorElement.style.display = 'none';
            loadingElement.style.display = 'none';
            // Also remove any error panel when hiding messages
            removeErrorPanel();
        }

        // Reset preview state (watchdog)
        function resetPreviewState() {
            try { if (renderTimeout) { clearTimeout(renderTimeout); renderTimeout = null; } } catch (e) {}
            isRendering = false;
            hideAllMessages();
        }
        
        // Hash utility (simple)
        function hashString(str) {
            let h = 0;
            for (let i = 0; i < str.length; i++) {
                h = ((h << 5) - h) + str.charCodeAt(i);
                h |= 0;
            }
            return h.toString();
        }

        // Scale persistence
        function saveScaleForContent() {
            if (!lastContentHash) return;
            try { localStorage.setItem('mm_scale_' + lastContentHash, getScale().toString()); } catch (e) {}
        }
        function restoreScaleForContent() {
            if (!lastContentHash) return false;
            try {
                const val = localStorage.getItem('mm_scale_' + lastContentHash);
                if (val) { setScale(parseFloat(val)); return true; }
            } catch (e) {}
            return false;
        }

        // Remove any Mermaid-injected global error SVGs (defensive cleanup)
        function cleanUpMermaidErrorArtifacts() {
            try {
                const candidates = Array.from(document.querySelectorAll('body > svg, body > div > svg, svg'));
                candidates.forEach(svg => {
                    const hasErrorIcon = !!svg.querySelector?.('.error-icon');
                    const hasErrorText = /Syntax error in text|No diagram type detected|mermaid version/i.test(svg.textContent || '');
                    if (hasErrorIcon || hasErrorText) {
                        const parent = svg.parentNode;
                        if (parent && parent.id !== 'preview' && parent.id !== 'preview-scale') {
                            parent.remove();
                        } else if (svg && parent === document.body) {
                            svg.remove();
                        }
                    }
                });
            } catch (e) { /* ignore */ }
        }

        // Remove any injected rich error panel
        function removeErrorPanel() {
            try {
                const container = document.querySelector('.preview-container');
                if (!container || !container.parentNode) return;
                const existing = container.parentNode.querySelectorAll('.error-panel');
                existing.forEach(el => el.remove());
            } catch (e) { /* ignore */ }
        }

        // Toggle preview container visibility
        function setPreviewVisible(visible) {
            try {
                const container = previewContainer;
                if (container) {
                    container.style.display = visible ? '' : 'none';
                }
            } catch (e) { /* ignore */ }
        }

        // Recreate preview container DOM (force fresh shell)
        function forceRecreatePreview() {
            previewElement.innerHTML = '<div id="preview-scale"><div class="placeholder">Diagram preview will appear here</div></div>';
        }

        // Orientation API
        function setOrientation(value) {
            orientation = (value === 'horizontal') ? 'horizontal' : 'vertical';
            if (previewContainer) {
                previewContainer.classList.remove('vertical', 'horizontal');
                previewContainer.classList.add(orientation);
            }
            // Ensure container is visible and rendering state is clean
            try { setPreviewVisible(true); } catch (e) {}
            try { resetPreviewState(); } catch (e) {}
            // No direct sizing changes here; keep consistent sizing rules and adjust direction only
            // If content already rendered, re-render with oriented direction for graph/flowchart
            if (lastSource && lastSource.trim()) {
                try {
                    const src = applyOrientationToSource(lastSource, orientation);
                    // Recreate DOM to avoid stale layout, then re-render debounced
                    forceRecreatePreview();
                    renderMermaidDebounced(src, 50);
                } catch (e) { /* ignore */ }
            }
        }

        // Ensure graph/flowchart respects chosen orientation by adjusting first diagram line
        function applyOrientationToSource(source, orient) {
            try {
                const lines = source.split(/\r?\n/);
                for (let i = 0; i < lines.length; i++) {
                    const line = lines[i];
                    // Skip empty and comment lines
                    if (/^\s*$/.test(line) || /^\s*%%/.test(line)) continue;
                    const m = line.match(/^\s*(graph|flowchart)\s+(TB|TD|LR|RL|BT)?(.*)$/i);
                    if (m) {
                        const keyword = m[1];
                        const rest = m[3] || '';
                        const dir = (orient === 'horizontal') ? 'LR' : 'TD';
                        const trimmedRest = rest.trimStart();
                        lines[i] = trimmedRest ? `${keyword} ${dir} ${trimmedRest}` : `${keyword} ${dir}`;
                    }
                    break;
                }
                return lines.join('\n');
            } catch (_) {
                return source;
            }
        }

        // Main render function
        async function renderMermaid(source) {
            // Skip if already rendering the same content
            if (isRendering) return;
            
            // Clear any pending render
            if (renderTimeout) {
                clearTimeout(renderTimeout);
            }
            
            // Handle empty content
            if (!source || source.trim() === '') {
                previewElement.innerHTML = '<div class="placeholder">Enter Mermaid syntax to see preview</div>';
                hideAllMessages();
                lastRenderedContent = source;
                removeErrorPanel();
                setPreviewVisible(true);
                return;
            }
            
            // Defensive cleanup before rendering
            cleanUpMermaidErrorArtifacts();
            isRendering = true;
            showLoading();
            lastSource = source;
            // Clear any prior watchdog
            if (renderWatchdog) { clearTimeout(renderWatchdog); renderWatchdog = null; }
            // Start watchdog (auto-retry if stuck)
            renderWatchdog = setTimeout(() => {
                if (isRendering) {
                    console.warn('Render watchdog triggered, resetting and retrying...');
                    try { mermaid.reset(); } catch (e) { /* ignore */ }
                    isRendering = false;
                    hideAllMessages();
                    forceRecreatePreview();
                    setTimeout(() => { renderMermaid(lastSource); }, 50);
                }
            }, 2000);
            
            try {
                console.log('Rendering Mermaid diagram:', source.substring(0, 100) + '...');
                // Apply orientation if applicable
                const oriented = applyOrientationToSource(source, orientation);
                
                // Validate first to avoid Mermaid's huge error SVGs
                try {
                    if (typeof mermaid.parse === 'function') {
                        await mermaid.parse(oriented);
                    } else if (mermaid.mermaidAPI && typeof mermaid.mermaidAPI.parse === 'function') {
                        await mermaid.mermaidAPI.parse(oriented);
                    }
                } catch (parseErr) {
                    const message = (parseErr && (parseErr.str || parseErr.message)) || 'Invalid Mermaid syntax';
                    showError(`Syntax error: ${message}`, source);
                    // Keep preview area empty during errors; rich panel appears below
                    previewElement.innerHTML = '<div id="preview-scale"></div>';
                    if (window.Android && window.Android.onRenderError) {
                        window.Android.onRenderError(message);
                    }
                    cleanUpMermaidErrorArtifacts();
                    return;
                }
                
                // Generate unique ID for this render (stable by hash to avoid mermaid caching glitches)
                const diagramId = 'diagram_' + hashString(oriented);
                lastContentHash = hashString(source);
                
                // Use Mermaid's render method
                // Ensure a clean renderer
                try { mermaid.reset(); } catch (e) { /* ignore */ }
                const { svg, bindFunctions } = await mermaid.render(diagramId, oriented);

                // Build scaled wrapper and normalize SVG sizing
                previewElement.innerHTML = '';
                const scaleWrapper = document.createElement('div');
                scaleWrapper.id = 'preview-scale';
                const currentScale = window.__previewScale || 1.0;
                scaleWrapper.style.transform = `scale(${currentScale})`;
                
                // Inject SVG string into wrapper
                scaleWrapper.innerHTML = svg;
                const svgEl = scaleWrapper.querySelector('svg');
                if (svgEl) {
                    svgEl.removeAttribute('width');
                    svgEl.removeAttribute('height');
                    // Consistent sizing to avoid zero-height on container
                    svgEl.style.width = '100%';
                    svgEl.style.height = 'auto';
                    svgEl.setAttribute('preserveAspectRatio', 'xMinYMin meet');
                }
                previewElement.appendChild(scaleWrapper);
                
                // Bind any interactive functions if needed
                if (bindFunctions) {
                    bindFunctions(previewElement);
                }
                
                // Show success status
                showStatus(`Diagram rendered successfully (${svg.length} characters)`);
                lastRenderedContent = source;
                // Ensure any prior error panel is removed on success
                removeErrorPanel();
                setPreviewVisible(true);
                
                // Notify Android about successful render
                if (window.Android && window.Android.onRenderSuccess) {
                    window.Android.onRenderSuccess(svg.length);
                }
                
                console.log('Mermaid render complete');
                // Final cleanup just in case
                cleanUpMermaidErrorArtifacts();
                
            } catch (error) {
                console.error('Mermaid render error:', error);
                
                // Show user-friendly error message
                const errorMessage = error.message || 'Failed to render diagram';
                showError(`Syntax error: ${errorMessage}`);
                
                // Keep preview area empty during errors; rich panel appears below
                previewElement.innerHTML = '<div id="preview-scale"></div>';
                // Ensure Mermaid-injected artifacts are not visible
                cleanUpMermaidErrorArtifacts();
                
            } finally {
                isRendering = false;
                loadingElement.style.display = 'none';
                // Failsafe: hide loader after 1s in any case
                setTimeout(() => { loadingElement.style.display = 'none'; }, 1000);
                // Stop watchdog
                if (renderWatchdog) { clearTimeout(renderWatchdog); renderWatchdog = null; }
            }
        }
        
        // Debounced render function
        function renderMermaidDebounced(source, delay = 150) {
            if (renderTimeout) {
                clearTimeout(renderTimeout);
            }
            
            renderTimeout = setTimeout(() => {
                // Safety guard: if still rendering, clear and force a fresh pass
                if (isRendering) {
                    isRendering = false;
                    loadingElement.style.display = 'none';
                }
                renderMermaid(source);
            }, delay);
        }
        
        // Theme switching
        function setTheme(theme) {
            try {
                mermaid.initialize({
                    theme: theme,
                    startOnLoad: false
                });
                
                // Re-render current content with new theme
                if (lastRenderedContent) {
                    renderMermaid(lastRenderedContent);
                }
                
                console.log('Theme updated to:', theme);
            } catch (error) {
                console.error('Theme update error:', error);
            }
        }
        
        // Utility functions for getting rendered content
        function getRenderedSVG() {
            const svgElement = previewElement.querySelector('svg');
            return svgElement ? svgElement.outerHTML : null;
        }
        
        function getPreviewDimensions() {
            const svgElement = previewElement.querySelector('svg');
            if (svgElement) {
                return {
                    width: svgElement.getAttribute('width') || svgElement.viewBox?.baseVal?.width || 0,
                    height: svgElement.getAttribute('height') || svgElement.viewBox?.baseVal?.height || 0
                };
            }
            return { width: 0, height: 0 };
        }
        
        // Clear preview
        function clearPreview() {
            previewElement.innerHTML = '<div class="placeholder">Diagram preview will appear here</div>';
            hideAllMessages();
            lastRenderedContent = '';
            console.log('Preview cleared');
        }
        
        // Zoom controls
        window.__previewScale = 1.0;
        function setScale(scale) {
            const wrapper = document.getElementById('preview-scale');
            window.__previewScale = Math.max(0.25, Math.min(scale, 5.0));
            if (wrapper) {
                wrapper.style.transform = `scale(${window.__previewScale})`;
            }
            // Persist scale for current content
            saveScaleForContent();
            return window.__previewScale;
        }
        function getScale() { return window.__previewScale || 1.0; }
        function zoomIn(step = 0.25) { return setScale(getScale() + step); }
        function zoomOut(step = 0.25) { return setScale(getScale() - step); }

        // Double-tap to zoom in
        let lastTapTime = 0;
        previewElement.addEventListener('touchend', function() {
            const now = Date.now();
            if (now - lastTapTime < 300) {
                zoomIn();
            }
            lastTapTime = now;
        });

        // Export functions to global scope for Android WebView access
        window.renderMermaid = renderMermaid;
        window.renderMermaidDebounced = renderMermaidDebounced;
        window.setTheme = setTheme;
        window.getRenderedSVG = getRenderedSVG;
        window.getPreviewDimensions = getPreviewDimensions;
        window.clearPreview = clearPreview;
        window.setScale = setScale;
        window.getScale = getScale;
        window.zoomIn = zoomIn;
        window.zoomOut = zoomOut;
        window.restoreScaleForContent = restoreScaleForContent;
        window.saveScaleForContent = saveScaleForContent;
        window.resetPreviewState = resetPreviewState;
        window.setOrientation = setOrientation;
        
        // Notify Android that WebView is ready
        console.log('Mermaid Preview ready, notifying Android');
        if (window.Android && window.Android.onWebViewReady) {
            window.Android.onWebViewReady();
        }
        
        // Show initial ready state
        showStatus('Preview ready - waiting for diagram content');
    </script>
</body>
</html>
